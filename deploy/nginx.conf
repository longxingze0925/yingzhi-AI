server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # 部署到其他 New API 实例时只需修改此上游域名。
    set $new_api_host new.0000.icu;
    set $new_api_upstream https://$new_api_host;
    set $web http://web:3000;

    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_set_header Host $new_api_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $new_api_host;
        proxy_pass $new_api_upstream;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $web;
    }
}
